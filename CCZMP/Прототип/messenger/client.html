<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCZMP Messenger // КРИПТО-ЧАТ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: radial-gradient(circle at 20% 30%, #0a0c0a, #010101);
            font-family: 'Courier New', 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .chat-container {
            width: 700px;
            max-width: 100%;
            background: #0a0f0a;
            border: 2px solid #00ff41;
            box-shadow: 0 0 20px #00ff4180;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        
        .chat-header {
            background: #030603;
            padding: 15px;
            border-bottom: 1px solid #00ff41;
            display: flex;
            justify-content: space-between;
            color: #00ff41;
            font-weight: bold;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #000000aa;
        }
        
        .message {
            padding: 8px 12px;
            border-left: 3px solid #00ff41;
            background: #0a0c0a;
            font-size: 0.9rem;
        }
        
        .system-message {
            color: #88ff88;
            border-left-color: #ffaa44;
            font-style: italic;
        }
        
        .message .meta {
            font-size: 0.7rem;
            color: #55aa55;
            margin-bottom: 4px;
        }
        
        .message .text {
            color: #ccffcc;
            word-wrap: break-word;
        }
        
        .chat-input {
            display: flex;
            border-top: 1px solid #00ff41;
            background: #030603;
        }
        
        #messageInput {
            flex: 1;
            background: #000;
            border: none;
            color: #00ff41;
            padding: 15px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        
        #sendBtn {
            background: #00ff4120;
            border: none;
            color: #00ff41;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        
        #sendBtn:hover {
            background: #00ff41;
            color: black;
        }
        
        .status {
            font-size: 0.7rem;
            color: #88ff88;
            padding: 5px 15px;
            background: #030603;
            border-top: 1px solid #00ff4140;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <span>🔒 CCZMP // КРИПТО-ЧАТ</span>
            <span id="connectionStatus">⚫ ОТКЛЮЧЁН</span>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Введите сообщение..." disabled>
            <button id="sendBtn" disabled>➤ ОТПРАВИТЬ</button>
        </div>
        <div class="status" id="statusText">Ожидание подключения...</div>
    </div>

    <script>
        let ws = null;
        let nickname = "";
        const messagesDiv = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusSpan = document.getElementById('connectionStatus');
        const statusText = document.getElementById('statusText');

        function addMessage(type, sender, text, time) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            if (type === 'system') msgDiv.classList.add('system-message');
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.innerText = time ? `${time} ${sender ? '['+sender+']' : ''}` : (sender ? `[${sender}]` : '');
            const textDiv = document.createElement('div');
            textDiv.className = 'text';
            textDiv.innerText = text;
            msgDiv.appendChild(meta);
            msgDiv.appendChild(textDiv);
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function connect() {
            // Определяем адрес сервера (можно подставить IP, если не localhost)
            const wsUrl = `ws://${window.location.hostname}:8765`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusSpan.innerHTML = "🟢 ПОДКЛЮЧЁН";
                statusText.innerText = "Соединение установлено. Введите ваше имя.";
                // Запрашиваем имя
                let name = prompt("Введите ваше имя (никнейм):", "Сталкер_" + Math.floor(Math.random() * 1000));
                if (!name) name = "Аноним";
                nickname = name;
                ws.send(JSON.stringify({
                    type: "name",
                    name: nickname
                }));
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "system") {
                    addMessage("system", null, data.text, data.time);
                    if (data.text.includes("присоединился") && data.text.includes(nickname)) {
                        statusText.innerText = "Вы в чате. Пишите сообщения.";
                    }
                } else if (data.type === "message") {
                    addMessage("user", data.sender, data.text, data.time);
                }
            };

            ws.onclose = () => {
                statusSpan.innerHTML = "🔴 ОТКЛЮЧЁН";
                statusText.innerText = "Соединение разорвано. Перезагрузите страницу для переподключения.";
                messageInput.disabled = true;
                sendBtn.disabled = true;
            };

            ws.onerror = (err) => {
                console.error("WebSocket error:", err);
                statusText.innerText = "Ошибка соединения. Убедитесь, что сервер запущен.";
            };
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({
                type: "message",
                text: text
            }));
            messageInput.value = "";
            messageInput.focus();
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        connect();
    </script>
</body>

</html>
